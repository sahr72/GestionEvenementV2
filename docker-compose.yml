services:
  postgres:
    image: postgres:16-alpine
    container_name: eventmanagement-postgres
    environment:
      POSTGRES_DB: evenementV2db
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventuser -d eventdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: