    :focus-visible { outline: 3px solid rgba(59,169,201,.7); outline-offset: 2px; }
    @media (max-width: 1000px) {
      .sidebar { width: 230px; flex-basis: 230px; }

      .mobile-menu { display: inline-flex; }

      .pipeline { grid-template-columns: 1fr; }
      .chart-row { grid-template-columns: 100px 1fr 30px; }
      .table-responsive { border-radius: 10px; }
    }
    @media print {
      .sidebar, .topbar, .no-print, .toast-stack { display: none !important; }
      .content { max-width: none; padding: 0; }
      .card { box-shadow: none; }
      body { background: #fff; }
    }
  </style>

<body>
  <div id="root"></div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <!-- Bootstrap JS améliore les composants visuels ; le routage principal reste sans dépendance. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

/* =============================================================================
   EventManagement V2 — Labo 2 · RBAC & Resource Authorization
   Moteur du prototype : logique PURE (aucune dépendance DOM).
   Contient : jeu de données, JWT simulé, pipeline d'autorisation en 5 étapes,
   machine à états du domaine, validations, routeur de navigation.
   ========================================================================== */
(function (root) {
'use strict';

/* ---------------------------------------------------------------- 1. Vocabulaire */
var ROLES = { ADMIN: 'Administrator', ORGANIZER: 'Organizer', PARTICIPANT: 'Participant' };

var P = {
  EVENTS_READ:    'Events.Read',
  EVENTS_CREATE:  'Events.Create',
  EVENTS_UPDATE:  'Events.Update',
  EVENTS_CONFIRM: 'Events.Confirm',
  EVENTS_CANCEL:  'Events.Cancel',
  EVENTS_CLOSE:   'Events.Close',
  COMMENTS_READ:   'Comments.Read',
  COMMENTS_CREATE: 'Comments.Create',
  COMMENTS_UPDATE: 'Comments.Update',
  COMMENTS_DELETE: 'Comments.Delete'
};

var ALL_PERMISSIONS = [
  P.EVENTS_READ, P.EVENTS_CREATE, P.EVENTS_UPDATE, P.EVENTS_CONFIRM, P.EVENTS_CANCEL, P.EVENTS_CLOSE,
  P.COMMENTS_READ, P.COMMENTS_CREATE, P.COMMENTS_UPDATE, P.COMMENTS_DELETE
];

/* Administrator et Organizer portent LES MÊMES permissions (cf. §6.8 de la spec).
   Seul l'Administrator bénéficie du bypass ressource. */
var ROLE_PERMISSIONS = {
  'Administrator': ALL_PERMISSIONS.slice(),
  'Organizer':     ALL_PERMISSIONS.slice(),
  'Participant':   [P.EVENTS_READ, P.COMMENTS_READ, P.COMMENTS_CREATE, P.COMMENTS_UPDATE, P.COMMENTS_DELETE]
};

var STATUTS = { DRAFT: 'Draft', CONFIRMED: 'Confirmed', CLOTURE: 'Cloture', ANNULE: 'Annule' };
var STATUT_LABELS = { Draft: 'Brouillon', Confirmed: 'Confirmé', Cloture: 'Clôturé', Annule: 'Annulé' };

/* ------------------------------------------------------ 2. Règles du domaine */
/* Le domaine ne connaît NI rôles NI claims : uniquement des gardes d'état. */
var DOMAINE = {
  peutEtreModifie:    function (e) { return e.statut !== STATUTS.ANNULE && e.statut !== STATUTS.CLOTURE; },
  peutEtreCommentee:  function (e) { return e.statut !== STATUTS.ANNULE && e.statut !== STATUTS.CLOTURE; },
  peutEtreConfirme:   function (e) { return e.statut === STATUTS.DRAFT; },
  peutEtreAnnule:     function (e) { return e.statut !== STATUTS.CLOTURE; },
  peutEtreCloture:    function (e) { return e.statut === STATUTS.CONFIRMED; }
};

/* --------------------------------------------------------- 3. Validations */
function vTitre(v) {
  if (v === undefined || v === null || String(v).trim() === '') return 'Le titre est obligatoire.';
  var t = String(v).trim();
  if (t.length < 3)  return 'Le titre doit contenir au moins 3 caractères.';
  if (t.length > 100) return 'Le titre ne peut pas dépasser 100 caractères.';
  return null;
}
function vDescription(v) {
  if (v === undefined || v === null || String(v).trim() === '') return 'La description est obligatoire.';
  var t = String(v).trim();
  if (t.length < 10)  return 'La description doit contenir au moins 10 caractères.';
  if (t.length > 500) return 'La description ne peut pas dépasser 500 caractères.';
  return null;
}
function vPersonne(v) {
  if (v === undefined || v === null || String(v).trim() === '') return 'La personne impliquée est obligatoire.';
  var t = String(v).trim();
  if (t.length > 100) return 'Le nom ne peut pas dépasser 100 caractères.';
  return null;
}
function vDate(v) {
  if (!v) return 'La date de l\u2019événement est obligatoire.';
  if (isNaN(Date.parse(v))) return 'La date de l\u2019événement est invalide.';
  return null;
}
function vContenu(v) {
  if (v === undefined || v === null || String(v).trim() === '') return 'Le contenu du commentaire est obligatoire.';
  var t = String(v).trim();
  if (t.length < 2)   return 'Le commentaire doit contenir au moins 2 caractères.';
  if (t.length > 500) return 'Le commentaire ne peut pas dépasser 500 caractères.';
  return null;
}

function validateEvent(input) {
  var errs = {};
  var a = vTitre(input.titre);               if (a) errs.titre = a;
  var b = vDescription(input.description);   if (b) errs.description = b;
  var c = vPersonne(input.personneImpliquee);if (c) errs.personneImpliquee = c;
  var d = vDate(input.dateEvenement);        if (d) errs.dateEvenement = d;
  return errs;
}
function validateComment(input) {
  var errs = {};
  var a = vContenu(input.contenu); if (a) errs.contenu = a;
  return errs;
}

/* ----------------------------------------------- 4. Opérations & autorisation */
/* Chaque opération décrit : la permission requise, la règle ressource, la validation. */
var OPERATIONS = {
  'events.read':     { label: 'Lister les événements',    permission: P.EVENTS_READ,    resource: null },
  'events.readOne':  { label: 'Consulter un événement',   permission: P.EVENTS_READ,    resource: { type: 'event', rule: 'exists' } },
  'events.create':   { label: 'Créer un événement',       permission: P.EVENTS_CREATE,  resource: null, validate: 'event' },
  'events.update':   { label: 'Modifier un événement',    permission: P.EVENTS_UPDATE,  resource: { type: 'event', rule: 'owner' }, validate: 'event' },
  'events.confirm':  { label: 'Confirmer un événement',   permission: P.EVENTS_CONFIRM, resource: { type: 'event', rule: 'owner' } },
  'events.cancel':   { label: 'Annuler un événement',     permission: P.EVENTS_CANCEL,  resource: { type: 'event', rule: 'owner' } },
  'events.close':    { label: 'Clôturer un événement',    permission: P.EVENTS_CLOSE,   resource: { type: 'event', rule: 'owner' } },
  'comments.read':   { label: 'Lister les commentaires',  permission: P.COMMENTS_READ,  resource: null },
  'comments.create': { label: 'Ajouter un commentaire',   permission: P.COMMENTS_CREATE,resource: { type: 'event',   rule: 'exists' }, validate: 'comment' },
  'comments.update': { label: 'Modifier un commentaire',  permission: P.COMMENTS_UPDATE,resource: { type: 'comment', rule: 'author' }, validate: 'comment' },
  'comments.delete': { label: 'Supprimer un commentaire', permission: P.COMMENTS_DELETE,resource: { type: 'comment', rule: 'author' } }
};

/* ------------------------------------------------ 5. JWT simulé (pédagogique) */
/* ⚠ Ce n'est PAS de la cryptographie : la « signature » est un hachage de
   démonstration, uniquement destiné à montrer la structure header.payload.signature. */
var JWT = { issuer: 'EventManagementLab', audience: 'EventManagementLab', secret: 'demo-secret-labo2' };

function b64url(str) {
  var b64;
  if (typeof Buffer !== 'undefined') {
    b64 = Buffer.from(str, 'utf8').toString('base64');
  } else {
    b64 = btoa(unescape(encodeURIComponent(str)));
  }
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64url(s) {
  var b64 = String(s).replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  if (typeof Buffer !== 'undefined') return Buffer.from(b64, 'base64').toString('utf8');
  return decodeURIComponent(escape(atob(b64)));
}
function fakeHash(input) {
  /* FNV-1a 32 bits ×2, purement démonstratif */
  var h1 = 0x811c9dc5, h2 = 0x01000193;
  for (var i = 0; i < input.length; i++) {
    h1 ^= input.charCodeAt(i); h1 = (h1 * 16777619) >>> 0;
    h2 = ((h2 << 5) - h2 + input.charCodeAt(i)) >>> 0;
  }
  return (h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0'));
}

function issueToken(user, options) {
  options = options || {};
  var nowSec = Math.floor(Date.now() / 1000);
  var ttl = options.ttlSeconds === undefined ? 7200 : options.ttlSeconds;
  var perms = ROLE_PERMISSIONS[user.role] || [];
  var header = { alg: 'HS256', typ: 'JWT' };
  var payload = {
    sub: user.id,
    name: user.nom,
    role: user.role,
    permission: perms,
    iss: JWT.issuer,
    aud: JWT.audience,
    iat: nowSec,
    exp: options.expired ? nowSec - 60 : nowSec + ttl
  };
  var h = b64url(JSON.stringify(header));
  var p = b64url(JSON.stringify(payload));
  var sig = b64url(fakeHash(h + '.' + p + '.' + JWT.secret));
  return h + '.' + p + '.' + sig;
}

function decodeToken(token) {
  if (!token || typeof token !== 'string') return { invalid: true, reason: 'Jeton absent.' };
  var parts = token.split('.');
  if (parts.length !== 3) return { invalid: true, reason: 'Jeton malformé (3 segments attendus).' };
  var header, payload;
  try { header = JSON.parse(fromB64url(parts[0])); payload = JSON.parse(fromB64url(parts[1])); }
  catch (e) { return { invalid: true, reason: 'Jeton illisible.' }; }

  var expected = b64url(fakeHash(parts[0] + '.' + parts[1] + '.' + JWT.secret));
  if (expected !== parts[2]) return { invalid: true, reason: 'Signature invalide (contenu altéré).' };
  if (header.alg !== 'HS256') return { invalid: true, reason: 'Algorithme non autorisé.' };
  if (payload.iss !== JWT.issuer) return { invalid: true, reason: 'Émetteur (iss) inattendu.' };
  if (payload.aud !== JWT.audience) return { invalid: true, reason: 'Audience (aud) inattendue.' };
  if (typeof payload.exp === 'number' && payload.exp < Math.floor(Date.now() / 1000))
    return { invalid: true, reason: 'Jeton expiré.' };
  if (!payload.sub) return { invalid: true, reason: 'Claim sub absente.' };

  return {
    userId: payload.sub,
    nom: payload.name,
    role: payload.role,
    permissions: payload.permission || [],
    payload: payload,
    header: header,
    token: token
  };
}

function hasPermission(session, permission) {
  if (!session || session.invalid) return false;
  return (session.permissions || []).indexOf(permission) !== -1;
}
function isAdministrator(session) {
  return !!session && !session.invalid && session.role === ROLES.ADMIN;
}

/* ------------------------------------------------- 7. Pipeline d'autorisation */
function step(key, label, status, detail) { return { key: key, label: label, status: status, detail: detail }; }

var STEP_LABELS = { jwt: 'JWT', permission: 'Permission', ressource: 'Ressource', application: 'Application', domaine: 'Domaine' };

function findEvent(state, id) {
  for (var i = 0; i < state.events.length; i++) if (state.events[i].id === id) return state.events[i];
  return null;
}
function findComment(state, id) {
  for (var i = 0; i < state.comments.length; i++) if (state.comments[i].id === id) return state.comments[i];
  return null;
}
function findUser(state, id) {
  for (var i = 0; i < state.users.length; i++) if (state.users[i].id === id) return state.users[i];
  return null;
}

function newId(state, prefix) { state.seq += 1; return prefix + '-' + state.seq; }

/* Dispatch : rejoue exactement l'ordre du pipeline réel
   JWT → Permission → Ressource → Application (validation) → Domaine (état). */
function dispatch(state, session, op, payload) {
  payload = payload || {};
  var trace = [];
  var def = OPERATIONS[op];
  if (!def) throw new Error('Opération inconnue : ' + op);

  /* Étape 1 — JWT */
  if (!session || session.invalid) {
    var why = (session && session.reason) ? session.reason : 'Jeton absent, expiré ou invalide.';
    trace.push(step('jwt', STEP_LABELS.jwt, 'fail', why));
    return { status: 401, operation: op, trace: trace, errors: null,
             message: 'Authentification requise.', detail: why };
  }
  trace.push(step('jwt', STEP_LABELS.jwt, 'ok', 'sub=' + session.userId + ' · role=' + session.role));

  /* Étape 2 — Permission */
  if (!hasPermission(session, def.permission)) {
    trace.push(step('permission', STEP_LABELS.permission, 'fail', def.permission + ' absente du jeton'));
    return { status: 403, operation: op, trace: trace, errors: null,
             message: 'Permission insuffisante.', detail: 'Le jeton ne porte pas la permission ' + def.permission + '.' };
  }
  trace.push(step('permission', STEP_LABELS.permission, 'ok', def.permission + ' présente'));

  /* Étape 3 — Ressource */
  var event = null, comment = null;
  if (def.resource) {
    if (def.resource.type === 'event') {
      var eventId = payload.evenementId || payload.id;
      event = findEvent(state, eventId);
      if (!event) {
        trace.push(step('ressource', STEP_LABELS.ressource, 'fail', 'Événement introuvable : ' + eventId));
        return { status: 404, operation: op, trace: trace, errors: null,
                 message: 'Ressource inexistante.', detail: 'Aucun événement ne correspond à l\u2019identifiant ' + eventId + '.' };
      }
      if (def.resource.rule === 'owner') {
        var estProprietaire = event.proprietaireId === session.userId;
        var bypass = isAdministrator(session);
        if (!estProprietaire && !bypass) {
          trace.push(step('ressource', STEP_LABELS.ressource, 'fail',
            'Propriétaire=' + event.proprietaireId + ' ≠ sub=' + session.userId + ' et rôle ≠ Administrator'));
          return { status: 403, operation: op, trace: trace, errors: null,
                   message: 'Ressource non accessible.', detail: 'Seul le propriétaire de l\u2019événement (ou un Administrator) peut effectuer cette opération.' };
        }
        trace.push(step('ressource', STEP_LABELS.ressource, 'ok',
          bypass && !estProprietaire ? 'Administrator : bypass ressource (IsInRole)' : 'Propriétaire de la ressource'));
      } else {
        trace.push(step('ressource', STEP_LABELS.ressource, 'ok', 'Événement existant'));
      }
    } else if (def.resource.type === 'comment') {
      comment = findComment(state, payload.id);
      if (!comment) {
        trace.push(step('ressource', STEP_LABELS.ressource, 'fail', 'Commentaire introuvable : ' + payload.id));
        return { status: 404, operation: op, trace: trace, errors: null,
                 message: 'Ressource inexistante.', detail: 'Aucun commentaire ne correspond à l\u2019identifiant ' + payload.id + '.' };
      }
      event = findEvent(state, comment.evenementId);
      if (def.resource.rule === 'author') {
        var estAuteur = comment.auteurId === session.userId;
        var bypassC = isAdministrator(session);
        if (!estAuteur && !bypassC) {
          trace.push(step('ressource', STEP_LABELS.ressource, 'fail',
            'Auteur=' + comment.auteurId + ' ≠ sub=' + session.userId + ' et rôle ≠ Administrator'));
          return { status: 403, operation: op, trace: trace, errors: null,
                   message: 'Ressource non accessible.', detail: 'Seul l\u2019auteur du commentaire (ou un Administrator) peut effectuer cette opération.' };
        }
        trace.push(step('ressource', STEP_LABELS.ressource, 'ok',
          bypassC && !estAuteur ? 'Administrator : bypass ressource (IsInRole)' : 'Auteur du commentaire'));
      }
    }
  } else {
    trace.push(step('ressource', STEP_LABELS.ressource, 'skip', 'Aucune règle ressource pour cette opération'));
  }

  /* Étape 4 — Application : validation */
  if (def.validate === 'event') {
    var errs = validateEvent(payload);
    if (Object.keys(errs).length) {
      trace.push(step('application', STEP_LABELS.application, 'fail', Object.keys(errs).length + ' champ(s) invalide(s)'));
      return { status: 400, operation: op, trace: trace, errors: errs,
               message: 'Validation échouée.', detail: 'Un ou plusieurs champs sont invalides.' };
    }
    trace.push(step('application', STEP_LABELS.application, 'ok', 'Validation FluentValidation'));
  } else if (def.validate === 'comment') {
    var errsC = validateComment(payload);
    if (Object.keys(errsC).length) {
      trace.push(step('application', STEP_LABELS.application, 'fail', 'Contenu invalide'));
      return { status: 400, operation: op, trace: trace, errors: errsC,
               message: 'Validation échouée.', detail: 'Le contenu du commentaire est invalide.' };
    }
    trace.push(step('application', STEP_LABELS.application, 'ok', 'Validation FluentValidation'));
  } else {
    trace.push(step('application', STEP_LABELS.application, 'skip', 'Aucune validation d\u2019entrée'));
  }

  /* Étape 5 — Domaine : gardes d'état + mutation */
  var now = new Date().toISOString();

  if (op === 'events.read' || op === 'events.readOne' || op === 'comments.read') {
    trace.push(step('domaine', STEP_LABELS.domaine, 'skip', 'Lecture : aucune mutation d\u2019état'));
    return { status: 200, operation: op, trace: trace, errors: null, message: 'OK', detail: '' };
  }

  if (op === 'events.create') {
    var ev = {
      id: newId(state, 'e'), titre: payload.titre.trim(), description: payload.description.trim(),
      personneImpliquee: payload.personneImpliquee.trim(), proprietaireId: session.userId,
      statut: STATUTS.DRAFT, dateEvenement: payload.dateEvenement,
      createdAtUtc: now, updatedAtUtc: now
    };
    state.events.push(ev);
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'Evenement.Create → statut Draft'));
    return { status: 201, operation: op, trace: trace, errors: null, message: 'Événement créé.', detail: 'Nouvel événement au statut Brouillon.', resourceId: ev.id };
  }

  if (op === 'events.update') {
    if (!DOMAINE.peutEtreModifie(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'PeutEtreModifie() = false (statut ' + STATUT_LABELS[event.statut] + ')'));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'L\u2019événement ne peut plus être modifié dans son état actuel.' };
    }
    event.titre = payload.titre.trim();
    event.description = payload.description.trim();
    event.personneImpliquee = payload.personneImpliquee.trim();
    event.dateEvenement = payload.dateEvenement;
    event.updatedAtUtc = now;
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'PeutEtreModifie() = true → Evenement.Modifier()'));
    return { status: 204, operation: op, trace: trace, errors: null, message: 'Événement modifié.', detail: '', resourceId: event.id };
  }

  if (op === 'events.confirm') {
    if (!DOMAINE.peutEtreConfirme(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'Transition Draft → Confirmed impossible depuis ' + STATUT_LABELS[event.statut]));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'Seul un événement au statut Brouillon peut être confirmé.' };
    }
    event.statut = STATUTS.CONFIRMED; event.updatedAtUtc = now;
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'Draft → Confirmed'));
    return { status: 204, operation: op, trace: trace, errors: null, message: 'Événement confirmé.', detail: '', resourceId: event.id };
  }

  if (op === 'events.cancel') {
    if (!DOMAINE.peutEtreAnnule(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'Annulation impossible depuis ' + STATUT_LABELS[event.statut]));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'Un événement clôturé ne peut pas être annulé.' };
    }
    event.statut = STATUTS.ANNULE; event.updatedAtUtc = now;
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', '→ Annule'));
    return { status: 204, operation: op, trace: trace, errors: null, message: 'Événement annulé.', detail: '', resourceId: event.id };
  }

  if (op === 'events.close') {
    if (!DOMAINE.peutEtreCloture(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'Transition Confirmed → Cloture impossible depuis ' + STATUT_LABELS[event.statut]));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'Seul un événement confirmé peut être clôturé.' };
    }
    event.statut = STATUTS.CLOTURE; event.updatedAtUtc = now;
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'Confirmed → Cloture'));
    return { status: 204, operation: op, trace: trace, errors: null, message: 'Événement clôturé.', detail: '', resourceId: event.id };
  }

  if (op === 'comments.create') {
    if (!DOMAINE.peutEtreCommentee(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'EnsureCommentable() = false (statut ' + STATUT_LABELS[event.statut] + ')'));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'Impossible de commenter un événement annulé ou clôturé.' };
    }
    var cm = { id: newId(state, 'c'), evenementId: event.id, auteurId: session.userId,
               contenu: payload.contenu.trim(), createdAtUtc: now, updatedAtUtc: now };
    state.comments.push(cm);
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'Evenement.AjouterCommentaire()'));
    return { status: 201, operation: op, trace: trace, errors: null, message: 'Commentaire ajouté.', detail: '', resourceId: cm.id };
  }

  if (op === 'comments.update') {
    if (event && !DOMAINE.peutEtreCommentee(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'Événement ' + STATUT_LABELS[event.statut] + ' : commentaires figés'));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'Les commentaires d\u2019un événement annulé ou clôturé ne peuvent plus être modifiés.' };
    }
    comment.contenu = payload.contenu.trim(); comment.updatedAtUtc = now;
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'Evenement.ModifierCommentaire()'));
    return { status: 204, operation: op, trace: trace, errors: null, message: 'Commentaire modifié.', detail: '', resourceId: comment.id };
  }

  if (op === 'comments.delete') {
    if (event && !DOMAINE.peutEtreCommentee(event)) {
      trace.push(step('domaine', STEP_LABELS.domaine, 'fail', 'Événement ' + STATUT_LABELS[event.statut] + ' : commentaires figés'));
      return { status: 409, operation: op, trace: trace, errors: null,
               message: 'Conflit d\u2019état métier.', detail: 'Les commentaires d\u2019un événement annulé ou clôturé ne peuvent plus être supprimés.' };
    }
    state.comments = state.comments.filter(function (x) { return x.id !== comment.id; });
    trace.push(step('domaine', STEP_LABELS.domaine, 'ok', 'Evenement.SupprimerCommentaire()'));
    return { status: 204, operation: op, trace: trace, errors: null, message: 'Commentaire supprimé.', detail: '', resourceId: comment.id };
  }

  trace.push(step('domaine', STEP_LABELS.domaine, 'skip', 'Aucune règle de domaine'));
  return { status: 200, operation: op, trace: trace, errors: null, message: 'OK', detail: '' };
}

/* --------------------------------------------------- 8. Authentification */
function authenticate(state, email, motDePasse) {
  var u = null;
  for (var i = 0; i < state.users.length; i++) {
    if (state.users[i].email.toLowerCase() === String(email || '').toLowerCase().trim()) { u = state.users[i]; break; }
  }
  if (!u) return { ok: false, error: 'Identifiants invalides.' };
  if (u.motDePasse !== motDePasse) return { ok: false, error: 'Identifiants invalides.' };
  return { ok: true, user: u, token: issueToken(u) };
}

  { path: '#/administration/jetons',           view: 'admin-tokens',       guard: 'auth', role: ROLES.ADMIN },
  { path: '#/administration/simulateur',       view: 'admin-simulator',    guard: 'auth', role: ROLES.ADMIN },
  { path: '#/journal',                         view: 'journal',            guard: 'auth' }
];

function matchRoute(hash) {
  var clean = String(hash || '').split('?')[0];
  if (!clean || clean === '#' || clean === '#/') clean = '#/tableau-de-bord';
  for (var i = 0; i < ROUTES.length; i++) {
    var r = ROUTES[i];
    var rp = r.path.split('/'), cp = clean.split('/');
    if (rp.length !== cp.length) continue;
    var params = {}, ok = true;
    for (var j = 0; j < rp.length; j++) {
      if (rp[j].charAt(0) === ':') params[rp[j].slice(1)] = cp[j];
      else if (rp[j] !== cp[j]) { ok = false; break; }
    }
    if (ok) return { route: r, params: params };
  }
  return null;
}

function resolveRoute(hash, state, session) {
  var m = matchRoute(hash);
  if (!m) return { view: 'notfound', outcome: 'notfound', status: 404, params: {},
                   reason: 'Route inconnue : ' + hash };

  var r = m.route;
  if (r.guard === 'public') return { view: r.view, outcome: 'ok', status: 200, params: m.params, route: r, mode: r.mode };

  if (!session || session.invalid)
    return { view: 'login', outcome: 'redirect-login', status: 401, params: m.params, route: r,
             reason: (session && session.reason) ? session.reason : 'Authentification requise.' };

  if (r.role && session.role !== r.role)
    return { view: 'forbidden', outcome: 'forbidden', status: 403, params: m.params, route: r,
             reason: 'Réservé au rôle ' + r.role + '. Rôle courant : ' + session.role + '.' };

  if (r.permission && !hasPermission(session, r.permission))
    return { view: 'forbidden', outcome: 'forbidden', status: 403, params: m.params, route: r,
             reason: 'Permission ' + r.permission + ' absente du jeton.' };

  if (r.resource && r.resource.type === 'event') {
    var ev = findEvent(state, m.params.id);
    if (!ev)
      return { view: 'notfound', outcome: 'notfound', status: 404, params: m.params, route: r,
               reason: 'Aucun événement ne correspond à l\u2019identifiant ' + m.params.id + '.' };
    if (r.resource.rule === 'owner' && ev.proprietaireId !== session.userId && !isAdministrator(session))
      return { view: 'forbidden', outcome: 'forbidden', status: 403, params: m.params, route: r,
               reason: 'Seul le propriétaire de l\u2019événement (ou un Administrator) peut le modifier.' };
  }

  return { view: r.view, outcome: 'ok', status: 200, params: m.params, route: r, mode: r.mode };
}

/* ------------------------------------------------------------ 10. Lectures */
function listEvents(state, filter) {
  filter = filter || {};
  var rows = state.events.slice();
  if (filter.statut) rows = rows.filter(function (e) { return e.statut === filter.statut; });
  if (filter.proprietaireId) rows = rows.filter(function (e) { return e.proprietaireId === filter.proprietaireId; });
  if (filter.q) {
    var q = filter.q.toLowerCase();
    rows = rows.filter(function (e) {
      return (e.titre + ' ' + e.description + ' ' + e.personneImpliquee).toLowerCase().indexOf(q) !== -1;
    });
  }
  if (filter.tri === 'date') rows.sort(function (a, b) { return Date.parse(a.dateEvenement) - Date.parse(b.dateEvenement); });
  else if (filter.tri === 'activite') rows.sort(function (a, b) { return Date.parse(b.updatedAtUtc) - Date.parse(a.updatedAtUtc); });
  else rows.sort(function (a, b) { return a.titre.localeCompare(b.titre); });
  return rows;
}

function commentsOf(state, eventId) {
  return state.comments
    .filter(function (c) { return c.evenementId === eventId; })
    .sort(function (a, b) { return Date.parse(a.createdAtUtc) - Date.parse(b.createdAtUtc); });
}

function commentCount(state, eventId) {
  return state.comments.filter(function (c) { return c.evenementId === eventId; }).length;
}

function getStats(state) {
  var parStatut = { Draft: 0, Confirmed: 0, Cloture: 0, Annule: 0 };
  state.events.forEach(function (e) { parStatut[e.statut] = (parStatut[e.statut] || 0) + 1; });
  var parRole = { Administrator: 0, Organizer: 0, Participant: 0 };
  state.comments.forEach(function (c) {
    var u = findUser(state, c.auteurId);
    if (u) parRole[u.role] = (parRole[u.role] || 0) + 1;
  });
  var parEvenement = state.events.map(function (e) {
    return { id: e.id, titre: e.titre, statut: e.statut, nb: commentCount(state, e.id) };
  }).sort(function (a, b) { return b.nb - a.nb; });

  return {
    nbEvenements: state.events.length,
    nbCommentaires: state.comments.length,
    nbUtilisateurs: state.users.length,
    parStatut: parStatut,
    parRole: parRole,
    parEvenement: parEvenement,
    commentables: state.events.filter(DOMAINE.peutEtreCommentee).length,
    modifiables: state.events.filter(DOMAINE.peutEtreModifie).length,
    moyenneCommentaires: state.events.length ? Math.round((state.comments.length / state.events.length) * 10) / 10 : 0
  };
}

/* ------------------------------------------------ 11. Matrices (pédagogie) */
function permissionMatrix() {
  return { permissions: ALL_PERMISSIONS.slice(), roles: [ROLES.ADMIN, ROLES.ORGANIZER, ROLES.PARTICIPANT] };
}
function operationMatrix() {
  return Object.keys(OPERATIONS).map(function (k) {
    var o = OPERATIONS[k];
    var regle = '—';
    if (o.resource) {
      regle = o.resource.rule === 'owner' ? 'Propriétaire || Administrator'
            : o.resource.rule === 'author' ? 'Auteur || Administrator'
            : 'Existence';
    }
    return { op: k, label: o.label, permission: o.permission, ressource: regle };
  });
}

der"><h2 class="mb-0">Contrôles appliqués</h2></div><div class="card-body small"><div class="timeline"><div class="timeline-item"><strong>1. Permission</strong><div class="timeline-label">${mode === 'edit' ? 'Events.Update' : 'Events.Create'}</div></div><div class="timeline-item"><strong>2. Ressource</strong><div class="timeline-label">${mode === 'edit' ? 'Propriétaire ou Administrator' : 'Non applicable'}</div></div><div class="timeline-item"><strong>3. Validation</strong><div class="timeline-label">Champs et longueurs</div></div><div class="timeline-item"><strong>4. Domaine</strong><div class="timeline-label">${mode === 'edit' ? 'PeutEtreModifie()' : 'Statut initial Draft'}</div></div></div></div></div></div></div>`;

lass="border rounded-3 p-3 h-100 hover-card"><i class="bi bi-${x[0]} fs-4 text-primary"></i><h3 class="h6 mt-2 mb-1">${x[1]}</h3><p class="text-muted small mb-0">${x[3]}</p></div></a></div>`).join('')}</div></div></div></div><div class="col-lg-5"><div class="card h-100"><div class="card-header"><h2 class="mb-0">Répartition des états</h2></div><div class="card-body">${Object.entries(st.parStatut).map(([k,v])=>`<div class="d-flex justify-content-between border-bottom py-2"><span>${E.STATUT_LABELS[k]}</span><strong>${v}</strong></div>`).join('')}<p class="small text-muted mt-3 mb-0">Les rôles ne sont pas une table métier dans ce labo : ils façonnent les claims émises dans le JWT.</p></div></div></div></div>`;

  function renderAdminPermissions() { const matrix=E.operationMatrix(); return `${pageHead('Administration / autorisation', 'Droits & policies', 'La permission est globale ; la ressource et le domaine ajoutent leurs propres décisions.', `<a class="btn btn-soft" href="#/journal"><i class="bi bi-activity me-2"></i>Voir le pipeline</a>`)}<div class="card mb-4"><div class="card-header"><h2 class="mb-0">Rôles × permissions</h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Permission</th>${['Administrator','Organizer','Participant'].map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${E.ALL_PERMISSIONS.map(p=>`<tr><td><code>${p}</code></td>${['Administrator','Organizer','Participant'].map(r=>`<td>${(E.ROLE_PERMISSIONS[r]||[]).includes(p)?'<span class="text-success fw-bold"><i class="bi bi-check-circle-fill"></i> Oui</span>':'<span class="text-muted"><i class="bi bi-dash-circle"></i> Non</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-header"><h2 class="mb-0">Opérations protégées</h2></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Opération</th><th>Permission</th><th>Contrôle ressource</th><th>Code métier</th></tr></thead><tbody>${matrix.map(x=>`<tr><td><strong>${x.label}</strong><div class="small text-muted"><code>${x.op}</code></div></td><td><code>${x.permission}</code></td><td>${x.ressource}</td><td><span class="badge text-bg-light">${x.op.split('.')[0]==='events'?'Evenement':'Commentaire'}</span></td></tr>`).join('')}</tbody></table></div></div>`; }

  function renderSimulator() { const defaultOp='events.update'; const ev=state.events[0]; return `${pageHead('Administration / laboratoire', 'Simulateur d’autorisation', 'Jouez une opération et observez la décision HTTP ainsi que chaque étape du pipeline.', `<button id="clearSimBtn" class="btn btn-outline-secondary"><i class="bi bi-eraser me-2"></i>Effacer</button>`)}<div class="row g-4"><div class="col-lg-5"><div class="card"><div class="card-header"><h2 class="mb-0">Paramètres du test</h2></div><div class="card-body"><form id="simForm"><div class="mb-3"><label class="form-label" for="simUser">Identité</label><select id="simUser" class="form-select">${state.users.map(u=>`<option value="${u.id}" ${u.id===app.session.userId?'selected':''}>${esc(u.nom)} — ${u.role}</option>`).join('')}</select></div><div class="mb-3"><label class="form-label" for="simOp">Opération</label><select id="simOp" class="form-select">${Object.entries(E.OPERATIONS).map(([k,o])=>`<option value="${k}" ${k===defaultOp?'selected':''}>${o.label} — ${o.permission}</option>`).join('')}</select></div><div class="mb-3"><label class="form-label" for="simResource">Ressource</label><select id="simResource" class="form-select">${state.events.map(e=>`<option value="${e.id}">${esc(e.titre)} — ${E.STATUT_LABELS[e.statut]}</option>`).join('')}<option value="e-999">Ressource inexistante — e-999</option></select></div><div class="mb-3"><label class="form-label" for="simComment">Commentaire</label><select id="simComment" class="form-select">${state.comments.slice(0,12).map(c=>`<option value="${c.id}">${esc(c.id)} — ${esc(c.contenu.slice(0,55))}</option>`).join('')}<option value="c-999">Commentaire inexistant — c-999</option></select></div><button class="btn btn-primary w-100" type="submit"><i class="bi bi-play-fill me-2"></i>Exécuter la décision</button></form></div></div><div class="card mt-4"><div class="card-body small"><strong>Lecture rapide</strong><p class="text-muted mb-0 mt-2">401 = JWT · 403 = permission   function bindLogin() {
    document.querySelectorAll('[data-demo-email]').forEach(btn => btn.addEventListener('click', () => { document.getElementById('loginEmail').value = btn.dataset.demoEmail; document.getElementById('loginPassword').value = 'Labo2024!'; }));
    const form=document.getElementById('loginForm'); if (!form) return; form.addEventListener('submit', e=>{e.preventDefault(); if(!form.checkValidity()){form.classList.add('was-validated'); return;} performLogin(document.getElementById('loginEmail').value,document.getElementById('loginPassword').value);});
  }
  function bindShell() {
    document.getElementById('logoutBtn')?.addEventListener('click', logout);
    document.getElementById('mobileMenuBtn')?.addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
    document.querySelectorAll('[data-route]').forEach(x=>x.addEventListener('click',()=>location.hash=x.dataset.route));
    document.querySelectorAll('.side-link').forEach(x=>x.addEventListener('click',()=>document.getElementById('sidebar')?.classList.remove('open')));
  }
  function setFieldError(input, message) { const wrap=input.parentElement; input.classList.toggle('is-invalid',!!message); const fb=wrap.querySelector('.invalid-feedback'); if(fb) fb.textContent=message||''; }
  function bindBody() {
    document.querySelectorAll('[data-event-action]').forEach(btn=>btn.addEventListener('click',()=>{ const id=btn.dataset.id, action=btn.dataset.eventAction; const label={confirm:'confirmer',cancel:'annuler',close:'clôturer'}[action]; if(!confirm(`Voulez-vous ${label} cet événement ?`))return; const op='events.'+action; const r=E.dispatch(state,app.session,op,{evenementId:id}); log('DOMAIN',`${op} ${id}`,r.status<400?'OK':'REFUS',r.status,r.detail); if(r.status<400){toast('Opération réussie',r.message,'success');}else toast(`${r.status} · ${r.message}`,r.detail,'danger'); render(); }));
    document.getElementById('eventSearch')?.addEventListener('input',e=>{app.eventFilter.q=e.target.value; rerenderBody();}); document.getElementById('eventStatus')?.addEventListener('change',e=>{app.eventFilter.statut=e.target.value; rerenderBody();}); document.getElementById('eventSort')?.addEventListener('change',e=>{app.eventFilter.tri=e.target.value; rerenderBody();}); document.getElementById('clearEventFilter')?.addEventListener('click',()=>{app.eventFilter={};rerenderBody();});
    document.getElementById('eventForm')?.addEventListener('submit',submitEventForm);
    document.getElementById('addCommentBtn')?.addEventListener('click',()=>openCommentModal(null,app.currentRoute.params.id));
    document.querySelectorAll('[data-comment-edit]').forEach(b=>b.addEventListener('click',()=>{const c=E.findComment(state,b.dataset.commentEdit);openCommentModal(c,c.evenementId);}));
    document.querySelectorAll('[data-comment-delete]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('Supprimer ce commentaire ?'))return;const r=E.dispatch(state,app.session,'comments.delete',{id:b.dataset.commentDelete});log('DOMAIN','comments.delete '+b.dataset.commentDelete,r.status<400?'OK':'REFUS',r.status,r.detail);toast(r.status<400?'Commentaire supprimé':`${r.status} · ${r.message}`,r.detail,r.status<400?'success':'danger');render();}));
    document.getElementById('resetDemoBtn')?.addEventListener('click',()=>{if(confirm('Réinitialiser les données de la démonstration ?'))resetDemo();});
    document.querySelectorAll('[data-switch-user]').forEach(b=>b.addEventListener('click',()=>{const u=E.findUser(state,b.dataset.switchUser);app.session=E.decodeToken(E.issueToken(u));saveSession();log('AUTH','SIMULATE '+u.role,'OK',200,u.nom);toast('Session simulée',`Vous êtes maintenant ${u.nom} (${u.role}).`,'success');location.hash='#/tableau-de-bord';}));
    document.getElementById('renewTokenBtn')?.addEventListener('click',()=>{const u=currentUser();app.session=E.decodeToken(E.issueToken(u));saveSession();log('AUTH','POST /dev/token','OK',200,'Jeton réémis pour '+u.role);toast('Jeton réémis','Les claims ont été régénérées.','success');render();});
    document.getElementById('simForm')?.addEventListener('submit',runSimulation); document.getElementById('clearSimBtn')?.addEventListener('click',()=>{document.getElementById('simResult').innerHTML='<div class="empty-state"><i class="bi bi-terminal"></i><h2 class="h5 mt-3">Aucune exécution</h2><p>Choisissez une identité et une opération.</p></div>';}); document.getElementById('clearLogBtn')?.addEventListener('click',()=>{app.log=[];render();});
  }
  function rerenderBody() { const currentHash=location.hash; const result=E.resolveRoute(currentHash,state,app.session); const body=document.getElementById('pageBody'); if(result.view==='events-list') body.innerHTML=renderEventsList(); bindBody(); }
  function submitEventForm(ev) { ev.preventDefault(); const form=ev.currentTarget, mode=form.dataset.mode,id=form.dataset.id; const payload={titre:document.getElementById('eventTitre').value,description:document.getElementById('eventDescription').value,personneImpliquee:document.getElementById('eventPersonne').value,dateEvenement:document.getElementById('eventDate').value}; const errors=E.validateEvent(payload); ['titre','description','personneImpliquee','dateEvenement'].forEach(k=>setFieldError(document.getElementById('event'+(k==='titre'?'Titre':k==='description'?'Description':k==='personneImpliquee'?'Personne':'Date')),errors[k])); if(Object.keys(errors).length){document.getElementById('eventFormAlert').innerHTML='<div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle me-2"></i>Corrigez les champs indiqués.</div>';return;} const op=mode==='edit'?'events.update':'events.create'; if(mode==='edit')payload.evenementId=id; const r=E.dispatch(state,app.session,op,payload);log('DOMAIN',op+(id?' '+id:''),r.status<400?'OK':'REFUS',r.status,r.detail);if(r.status>=400){document.getElementById('eventFormAlert').innerHTML=`<div class="alert alert-danger py-2"><strong>${r.status} · ${esc(r.message)}</strong><br><span class="small">${esc(r.detail)}</span></div>`;toast(`${r.status} · ${r.message}`,r.detail,'danger');return;}toast('Opération réussie',r.message,'success'); location.hash='#/evenements/'+r.resourceId; }
  function openCommentModal(comment,eventId) { const isEdit=!!comment; const modal=document.createElement('div'); modal.className='modal fade'; modal.id='commentModal'; modal.tabIndex=-1; modal.innerHTML=`<div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5">${isEdit?'Modifier':'Ajouter'} un commentaire</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div><form id="commentForm"><div class="modal-body"><label class="form-label" for="commentContent">Contenu</label><textarea id="commentContent" class="form-control" rows="5" maxlength="500" required>${esc(comment?.contenu||'')}</textarea><div class="form-text">2 à 500 caractères.</div><div class="invalid-feedback"></div><div id="commentAlert" class="mt-3"></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button><button class="btn btn-primary" type="submit">${isEdit?'Enregistrer':'Publier'}</button></div></form></div></div>`; document.body.appendChild(modal); const bs=new bootstrap.Modal(modal);bs.show();modal.addEventListener('hidden.bs.modal',()=>modal.remove());document.getElementById('commentForm').addEventListener('submit',e=>{e.preventDefault();const contenu=document.getElementById('commentContent').value,er=E.validateComment({contenu});if(er.contenu){document.getElementById('commentContent').classList.add('is-invalid');document.querySelector('#commentContent + .form-text + .invalid-feedback').textContent=er.contenu;return;}const op=isEdit?'comments.update':'comments.create',payload=isEdit?{id:comment.id,contenu}:{evenementId,contenu};const r=E.dispatch(state,app.session,op,payload);log('DOMAIN',op,r.status<400?'OK':'REFUS',r.status,r.detail);if(r.status>=400){document.getElementById('commentAlert').innerHTML=`<div class="alert alert-danger py-2">${r.status} · ${esc(r.detail)}</div>`;return;}bs.hide();toast('Commentaire enregistré',r.message,'success');render();}); }
  function runSimulation(e) { e.preventDefault(); const uid=document.getElementById('simUser').value, u=E.findUser(state,uid), session=E.decodeToken(E.issueToken(u)),op=document.getElementById('simOp').value, eventId=document.getElementById('simResource').value, commentId=document.getElementById('simComment').value; let payload={}; if(op.startsWith('events.'))payload={id:eventId,evenementId:eventId,titre:'Titre de simulation valide',description:'Description de simulation suffisamment longue.',personneImpliquee:u.nom,dateEvenement:new Date().toISOString()}; else if(op==='comments.create')payload={evenementId:eventId,contenu:'Commentaire de simulation'}; else payload={id:commentId,contenu:'Commentaire de simulation modifié'}; const r=E.dispatch(state,session,op,payload);log('SIMULATOR',op,r.status<400?'OK':'REFUS',r.status,`${u.role} · ${r.detail}`);document.getElementById('simResult').innerHTML=`<div class="card-header d-flex justify-content-between align-items-center"><h2 class="mb-0">Décision</h2><span class="badge ${r.status>=400?'text-bg-danger':'text-bg-success'}">HTTP ${r.status}</span></div><div class="card-body"><div class="alert ${r.status>=400?'alert-danger':'alert-success'}"><strong>${esc(r.message)}</strong><br><span class="small">${esc(r.detail)}</span></div><div class="small-caps mb-2">Trace d’exécution</div><div class="pipeline">${r.trace.map(t=>`<div class="pipeline-step ${t.status}"><div class="pipeline-kicker">${t.label}</div><div class="pipeline-detail">${esc(t.detail)}</div></div>`).join('')}</div></div>`; }

  window.addEventListener('hashchange', render);
  restoreSession();
  if (!location.hash) location.hash = app.session ? '#/tableau-de-bord' : '#/connexion'; else render();
  </script>
</body>
</html>
